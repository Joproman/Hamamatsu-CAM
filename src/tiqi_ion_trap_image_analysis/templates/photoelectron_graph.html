<html>
    <head>
        <title>Photoelectrons vs Time Graph</title>
        <link rel="shortcut icon" href="#">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css">
        <style>
            .graph-container {
                margin: 20px;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 8px;
                background-color: #f9f9f9;
            }
            h1, h2 {text-align: center}
            .chart-wrapper {
                position: relative;
                height: 400px;
                margin-bottom: 30px;
            }
        </style>
    </head>
    <body>
        <h1 style="font-size: 45px">Photoelectrons vs Time Graphs</h1>

        <div class="graph-container">
            <h2>Full Camera Photoelectron Count</h2>
            <div class="chart-wrapper">
                <canvas id="fullCameraChart"></canvas>
            </div>
        </div>

        <div id="roiGraphsContainer">
        </div>

        <div style="text-align: center; margin: 20px;">
            <form action="/">
                <input type="submit" value="Back to Main" style="padding: 10px 20px; font-size: 16px;" />
            </form>
        </div>

        <script>
            let fullCameraChart;
            let roiCharts = {};

            // Chart configuration
            const chartConfig = {
                type: 'line',
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            title: {
                                display: true,
                                text: 'Time (seconds)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Photoelectron Count'
                            },
                            beginAtZero: false,  // Don't force zero if data doesn't start at zero
                            ticks: {
                                callback: function(value) {
                                    // Format large numbers with commas
                                    return value.toLocaleString();
                                }
                            },
                            // Remove any fixed min/max so they can be set dynamically
                            min: undefined,
                            max: undefined
                        }
                    },
                    plugins: {
                        legend: {
                            display: true
                        }
                    }
                }
            };

            function initializeFullCameraChart() {
                const ctx = document.getElementById('fullCameraChart').getContext('2d');
                fullCameraChart = new Chart(ctx, {
                    ...chartConfig,
                    data: {
                        datasets: [{
                            label: 'Full Camera Photoelectrons',
                            data: [],
                            borderColor: 'rgb(75, 192, 192)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            tension: 0.1
                        }]
                    }
                });
            }

            function createROIChart(roiId) {
                const container = document.getElementById('roiGraphsContainer');

                // Create ROI graph container
                const roiDiv = document.createElement('div');
                roiDiv.className = 'graph-container';
                roiDiv.id = `roi-graph-${roiId}`;
                roiDiv.innerHTML = `
                    <h2>ROI ${roiId} Photoelectron Count</h2>
                    <div class="chart-wrapper">
                        <canvas id="roiChart${roiId}"></canvas>
                    </div>
                `;

                container.appendChild(roiDiv);

                // Initialize chart
                const ctx = document.getElementById(`roiChart${roiId}`).getContext('2d');
                roiCharts[roiId] = new Chart(ctx, {
                    ...chartConfig,
                    data: {
                        datasets: [{
                            label: `ROI ${roiId} Photoelectrons`,
                            data: [],
                            borderColor: `hsl(${roiId * 60}, 70%, 50%)`,
                            backgroundColor: `hsla(${roiId * 60}, 70%, 50%, 0.2)`,
                            tension: 0.1
                        }]
                    }
                });
            }

            function updateCharts() {
                fetch('/photoelectron_data')
                    .then(response => response.json())
                    .then(data => {
                        console.log('Received photoelectron data:', data);

                        // Update full camera chart
                        if (data.timestamps && data.counts && data.counts.length > 0) {
                            const startTime = data.timestamps[0] || 0;
                            const chartData = data.timestamps.map((timestamp, index) => ({
                                x: timestamp - startTime,
                                y: data.counts[index]
                            }));

                            console.log('Chart data for full camera:', chartData);
                            console.log('Y-values range:', Math.min(...data.counts), 'to', Math.max(...data.counts));

                            fullCameraChart.data.datasets[0].data = chartData;

                            // Dynamic Y-axis scaling with improved logic
                            if (data.counts.length > 0) {
                                const maxCount = Math.max(...data.counts);
                                const minCount = Math.min(...data.counts);
                                const range = maxCount - minCount;
                                const padding = Math.max(range * 0.1, maxCount * 0.05, 1); // Ensure minimum padding

                                const yMin = Math.max(0, minCount - padding);
                                const yMax = maxCount + padding;

                                console.log(`Setting Y-axis range: ${yMin.toFixed(0)} to ${yMax.toFixed(0)} (range: ${range.toFixed(0)}, padding: ${padding.toFixed(0)})`);

                                // Update the chart options
                                fullCameraChart.options.scales.y.min = yMin;
                                fullCameraChart.options.scales.y.max = yMax;

                                // Force the chart to recognize the new scale
                                fullCameraChart.options.scales.y.suggestedMin = yMin;
                                fullCameraChart.options.scales.y.suggestedMax = yMax;
                            }

                            fullCameraChart.update('none');
                        } else {
                            console.log('No valid data received for full camera chart');
                        }

                        // Update ROI charts
                        for (const roiId in data.roi_data) {
                            if (!roiCharts[roiId]) {
                                createROIChart(roiId);
                            }

                            const roiData = data.roi_data[roiId];
                            if (roiData.timestamps && roiData.counts && roiData.counts.length > 0) {
                                const startTime = roiData.timestamps[0] || 0;
                                const chartData = roiData.timestamps.map((timestamp, index) => ({
                                    x: timestamp - startTime,
                                    y: roiData.counts[index]
                                }));

                                console.log(`ROI ${roiId} chart data:`, chartData);
                                console.log(`ROI ${roiId} Y-values range:`, Math.min(...roiData.counts), 'to', Math.max(...roiData.counts));

                                roiCharts[roiId].data.datasets[0].data = chartData;

                                // Dynamic Y-axis scaling for ROI charts (same improved logic as full camera)
                                if (roiData.counts.length > 0) {
                                    const maxCount = Math.max(...roiData.counts);
                                    const minCount = Math.min(...roiData.counts);
                                    const range = maxCount - minCount;
                                    const padding = Math.max(range * 0.1, maxCount * 0.05, 1); // Ensure minimum padding

                                    const yMin = Math.max(0, minCount - padding);
                                    const yMax = maxCount + padding;

                                    console.log(`ROI ${roiId} Y-axis range: ${yMin.toFixed(0)} to ${yMax.toFixed(0)} (range: ${range.toFixed(0)})`);

                                    // Update the chart options
                                    roiCharts[roiId].options.scales.y.min = yMin;
                                    roiCharts[roiId].options.scales.y.max = yMax;

                                    // Force the chart to recognize the new scale
                                    roiCharts[roiId].options.scales.y.suggestedMin = yMin;
                                    roiCharts[roiId].options.scales.y.suggestedMax = yMax;
                                }

                                roiCharts[roiId].update('none');
                            }
                        }

                        // Remove charts for deleted ROIs
                        for (const roiId in roiCharts) {
                            if (!(roiId in data.roi_data)) {
                                const roiDiv = document.getElementById(`roi-graph-${roiId}`);
                                if (roiDiv) {
                                    roiDiv.remove();
                                }
                                roiCharts[roiId].destroy();
                                delete roiCharts[roiId];
                            }
                        }
                    })
                    .catch(error => console.error('Error fetching photoelectron data:', error));
            }

            // Initialize charts and start updating
            window.onload = function() {
                initializeFullCameraChart();
                updateCharts();
                setInterval(updateCharts, 1000); // Update every second
            };
        </script>
    </body>
</html>
