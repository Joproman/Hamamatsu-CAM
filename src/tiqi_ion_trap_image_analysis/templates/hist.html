<html>
    <head>
        <title>Histogram tweak</title>
        <link rel="shortcut icon" href="#">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        <style>
            .img-container {
                display: block;
                text-align: center;
            }
            h1 {text-align: center}
            h2 {text-align: center}
            h3 {text-align: center}
            div {text-align: center}
            form {display: inline}
        </style>
    </head>
    <body>
        <h2 style="font-size: 35px">Photoelectron Histogram:</h2>
        <p style="text-align: center; font-size: 18px;">Frequency vs Photoelectrons per Pixel</p>
        <span class="img-container">
            <img src="{{ url_for('video_feed_hist_img') }}" alt="Camera Image" width="auto" height="400" style="margin: 10px;">
            <img src="{{ url_for('video_feed_hist') }}" alt="Photoelectron Histogram" width="auto" height="400" style="margin: 10px;">
        </span>
        <div>
            <p style="font-size: 16px;">The histogram shows the distribution of photoelectron counts per pixel across the entire camera image.</p>
            <p style="font-size: 16px;">This provides insight into the light intensity distribution and noise characteristics.</p>
        </div>
        <br>
        <div>
            <form action="/">
                <input type="submit" value="Return" />
            </form>
        </div>
        <script type="text/javascript" src="{{ url_for('static', filename='histogram.js') }}"></script>
    </body>
</html>
